<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Research Hub · Map</title>
    <script>
        // Apply saved theme before first paint (no flash). Falls back to the OS setting.
        (function () {
            try {
                var t = localStorage.getItem('theme');
                if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
            } catch (e) {}
        })();
    </script>
    <style>
        :root {
            --primary: #005b96;
            --surface: #fafbfc;
            --border: #e1e5e8;
            --text: #1f2328;
            --text-soft: #656d76;
            --bg: #ffffff;
            --hero-grad: linear-gradient(135deg, #005b96 0%, #0086d6 100%);
            color-scheme: light;
        }
        /* Dark theme — explicit choice, or OS preference when none saved */
        :root[data-theme="dark"] {
            --primary: #58a6ff;
            --primary-light: #132b44;
            --primary-fill: #1f6feb;
            --primary-fill-hover: #388bfd;
            --bg: #161b22;
            --surface: #0d1117;
            --border: #30363d;
            --text: #e6edf3;
            --text-soft: #9da7b3;
            --text-muted: #7d8590;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.4);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.5);
            --hero-grad: linear-gradient(135deg, #0a3d62 0%, #0b5d91 100%);
            color-scheme: dark;
        }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --primary: #58a6ff;
                --primary-light: #132b44;
                --primary-fill: #1f6feb;
                --primary-fill-hover: #388bfd;
                --bg: #161b22;
                --surface: #0d1117;
                --border: #30363d;
                --text: #e6edf3;
                --text-soft: #9da7b3;
                --text-muted: #7d8590;
                --shadow-sm: 0 1px 3px rgba(0,0,0,0.4);
                --shadow-md: 0 4px 16px rgba(0,0,0,0.5);
                --hero-grad: linear-gradient(135deg, #0a3d62 0%, #0b5d91 100%);
                color-scheme: dark;
            }
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }
        body {
            font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--surface);
            color: var(--text);
            line-height: 1.55;
            min-height: 100vh;
        }
        a { color: inherit; text-decoration: none; }

        /* Header — keep in sync with index-rebuild/templates/index.html */
        header.hero {
            background: var(--hero-grad);
            color: white;
            padding: 36px 0 28px;
        }
        .hero-inner {
            max-width: 1280px; margin: 0 auto; padding: 0 32px;
            display: flex; justify-content: space-between; align-items: center; gap: 24px; flex-wrap: wrap;
        }
        .hero .curator { margin: 0 0 4px; font-size: 12px; font-weight: 500; letter-spacing: 1.2px; opacity: 0.78; }
        .hero h1 { margin: 0 0 8px; font-size: 32px; font-weight: 700; letter-spacing: -0.3px; }
        .hero .meta { opacity: 0.92; font-size: 14px; }
        .site-tabs {
            display: inline-flex; padding: 4px; gap: 4px;
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.28);
            border-radius: 10px;
        }
        .site-tabs a {
            padding: 8px 22px; border-radius: 7px;
            font-size: 14px; font-weight: 600; color: rgba(255,255,255,0.9);
            transition: background 0.15s, color 0.15s;
        }
        .site-tabs a:hover { background: rgba(255,255,255,0.16); color: white; }
        .site-tabs a.active { background: white; color: #005b96; }
        .hero-actions { display: flex; align-items: center; gap: 10px; }
        .theme-toggle {
            display: inline-flex; align-items: center; justify-content: center;
            width: 40px; height: 40px; padding: 0; cursor: pointer;
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.28);
            border-radius: 10px; color: white;
            transition: background 0.15s;
        }
        .theme-toggle:hover { background: rgba(255,255,255,0.22); }
        .theme-toggle svg { width: 18px; height: 18px; }
        .theme-toggle .icon-sun { display: none; }
        :root[data-theme="dark"] .theme-toggle .icon-sun { display: block; }
        :root[data-theme="dark"] .theme-toggle .icon-moon { display: none; }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) .theme-toggle .icon-sun { display: block; }
            :root:not([data-theme="light"]) .theme-toggle .icon-moon { display: none; }
        }

        .placeholder {
            max-width: 1280px; margin: 48px auto; padding: 0 32px;
        }
        .placeholder .card {
            background: var(--bg);
            border: 1px dashed var(--border);
            border-radius: 12px;
            padding: 64px 24px;
            text-align: center;
            color: var(--text-soft);
        }
        .placeholder h2 { margin: 0 0 8px; color: var(--text); font-size: 20px; }
        .placeholder p { margin: 0; font-size: 14px; }
        @media (max-width: 640px) {
            .hero-inner, .placeholder { padding: 0 16px; }
            .hero h1 { font-size: 26px; }
        }
    </style>
</head>
<body>
    <header class="hero">
        <div class="hero-inner">
            <div class="hero-title">
                <div class="curator">Curated by JINUNG LEE</div>
                <h1>Research Hub</h1>
                <div class="meta">Research Map</div>
            </div>
            <div class="hero-actions">
            <nav class="site-tabs" aria-label="Site sections">
                <a href="../index.html">Archive</a>
                <a href="index.html" class="active" aria-current="page">Map</a>
                <a href="../ResearchNotes/index.html">Research Notes</a>
            </nav>
                <button class="theme-toggle" id="theme-toggle" type="button" aria-label="라이트/다크 모드 전환" title="라이트/다크 모드 전환">
                    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
                </button>
            </div>
        </div>
    </header>

    <main class="placeholder">
        <div class="card">
            <h2>Research Map 준비 중</h2>
            <p>문헌 간 계보·비교·주제 관계를 지도 형태로 정리할 예정입니다.</p>
        </div>
    </main>
    <script>
        // Light/dark toggle — keep in sync across index-rebuild template, Map/, ResearchNotes/
        (function () {
            var btn = document.getElementById('theme-toggle');
            if (!btn) return;
            btn.addEventListener('click', function () {
                var root = document.documentElement;
                var cur = root.getAttribute('data-theme') ||
                    (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                var next = cur === 'dark' ? 'light' : 'dark';
                root.setAttribute('data-theme', next);
                try { localStorage.setItem('theme', next); } catch (e) {}
            });
        })();
    </script>
</body>
</html>
