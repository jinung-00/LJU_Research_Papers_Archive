<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LJU Research Papers Archive</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 900px; margin: 0 auto; padding: 2rem 1.25rem; line-height: 1.6;
    }
    header { border-bottom: 1px solid #8884; padding-bottom: 1rem; margin-bottom: 1.5rem; }
    h1 { margin: 0 0 .25rem; font-size: 1.6rem; }
    .sub { color: #8a8a8a; font-size: .95rem; }
    #search { width: 100%; padding: .6rem .8rem; font-size: 1rem; margin: 1rem 0;
      border: 1px solid #8886; border-radius: 8px; box-sizing: border-box; }
    .chips { display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: 1.25rem; }
    .chip { font-size: .8rem; padding: .2rem .6rem; border: 1px solid #8886; border-radius: 999px; cursor: pointer; }
    ul#papers { list-style: none; padding: 0; }
    ul#papers li { padding: .6rem 0; border-bottom: 1px solid #8882; }
    .empty { color: #8a8a8a; font-style: italic; padding: 2rem 0; text-align: center; }
    footer { margin-top: 2rem; font-size: .8rem; color: #8a8a8a; }
  </style>
</head>
<body>
  <header>
    <h1>LJU Research Papers Archive</h1>
    <div class="sub">Curated paper summaries · maintained by ARCHI</div>
  </header>

  <input id="search" type="search" placeholder="Search papers by title, author, keyword…" disabled>
  <div class="chips" id="chips"><!-- keyword chips: regenerated by index-rebuild --></div>

  <ul id="papers"></ul>
  <div class="empty" id="empty">No papers published yet. ARCHI will add summaries here.</div>

  <footer>
    Auto-generated index — regenerated by ARCHI's <code>index-rebuild</code> skill.
  </footer>

  <script>
    // Placeholder. The index-rebuild skill will replace this with a real
    // paper list (built from each Paper/{paper_id}.html's <meta keywords>),
    // wire up the search box, and render keyword chips + read-tracking.
    (function () {
      const papers = []; // filled by index-rebuild
      const list = document.getElementById('papers');
      const empty = document.getElementById('empty');
      if (papers.length) { empty.style.display = 'none'; }
    })();
  </script>
</body>
</html>
