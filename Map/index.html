<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Research Hub · Map</title>
    <script>
        // Apply saved theme before first paint (no flash). Default = light.
        (function () {
            try {
                var t = localStorage.getItem('theme');
                if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
            } catch (e) {}
        })();
    </script>
    <style>
        /* WOONG-style theme (paper / forest green, serif headings). Default light; dark via the toggle.
           Tokens + header are shared by index (index-rebuild template), Map/ and ResearchNotes/. */
        :root {
            --bg: #fbfaf6; --surface: #f4f1ea; --surface-2: #efebe2;
            --border: #e2ddd1; --border-strong: #cfc8b8;
            --text: #23262a; --text-soft: #4c5157; --text-muted: #858a8f;
            --primary: #2f4a3a; --primary-ink: #f3efe6; --primary-light: #e3eadf; --primary-bright: #2f6b4a;
            --chip-bg: #efebe2;
            --shadow-md: 0 1px 2px rgba(40,35,25,.05), 0 6px 22px rgba(40,35,25,.07);
            --sans: "Pretendard", "Pretendard Variable", "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", system-ui, sans-serif;
            --serif: "Iowan Old Style", "Charter", "Georgia", "Noto Serif KR", "Batang", serif;
            color-scheme: light;
        }
        :root[data-theme="dark"] {
            --bg: #222420; --surface: #1b1c1a; --surface-2: #2a2c27;
            --border: #33362f; --border-strong: #45493f;
            --text: #e8e5dc; --text-soft: #bdb9ae; --text-muted: #8b8a82;
            --primary: #9cc3a6; --primary-ink: #14201a; --primary-light: #2b3a2f; --primary-bright: #9cc3a6;
            --chip-bg: #2a2c27;
            --shadow-md: 0 1px 2px rgba(0,0,0,.3), 0 8px 26px rgba(0,0,0,.28);
            color-scheme: dark;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }
        body {
            font-family: var(--sans);
            background: var(--surface); color: var(--text);
            line-height: 1.55; min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }
        a { color: inherit; text-decoration: none; }
        ::selection { background: var(--primary-light); }

        /* Header — keep in sync with index-rebuild/templates/index.html */
        header.hero { background: var(--bg); color: var(--text); padding: 34px 0 26px; border-bottom: 1px solid var(--border); }
        .hero-inner {
            max-width: 1280px; margin: 0 auto; padding: 0 32px;
            display: flex; justify-content: space-between; align-items: center; gap: 24px; flex-wrap: wrap;
        }
        .hero .curator { margin: 0 0 6px; font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--text-muted); }
        .hero h1 { margin: 0 0 6px; font-family: var(--serif); font-size: 36px; font-weight: 700; letter-spacing: .01em; color: var(--primary); }
        .hero .meta { font-size: 13.5px; color: var(--text-soft); }
        .site-tabs { display: inline-flex; padding: 3px; gap: 2px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; }
        .site-tabs a {
            padding: 7px 18px; border-radius: 7px; font-size: 13.5px; font-weight: 600; color: var(--text-soft);
            transition: background .15s, color .15s;
        }
        .site-tabs a:hover { background: var(--surface-2); color: var(--text); }
        .site-tabs a.active { background: var(--primary-light); color: var(--primary); }
        .hero-actions { display: flex; align-items: center; gap: 10px; }
        .theme-toggle {
            display: inline-flex; align-items: center; justify-content: center;
            width: 38px; height: 36px; padding: 0; cursor: pointer;
            background: transparent; border: 1px solid var(--border-strong); border-radius: 9px; color: var(--text-soft);
            transition: background .15s, color .15s;
        }
        .theme-toggle:hover { background: var(--surface-2); color: var(--text); }
        .theme-toggle svg { width: 17px; height: 17px; }
        .theme-toggle .icon-sun { display: none; }
        :root[data-theme="dark"] .theme-toggle .icon-sun { display: block; }
        :root[data-theme="dark"] .theme-toggle .icon-moon { display: none; }

        .placeholder { max-width: 1280px; margin: 48px auto; padding: 0 32px; }
        .placeholder .card {
            background: var(--bg); border: 1px dashed var(--border-strong); border-radius: 12px;
            padding: 64px 24px; text-align: center; color: var(--text-soft);
        }
        .placeholder h2 { margin: 0 0 8px; font-family: var(--serif); font-weight: 600; color: var(--text); font-size: 22px; }
        .placeholder p { margin: 0; font-size: 14px; }
        @media (max-width: 640px) {
            .hero-inner, .placeholder { padding: 0 16px; }
            .hero h1 { font-size: 28px; }
        }
    </style>
</head>
<body>
    <header class="hero">
        <div class="hero-inner">
            <div class="hero-title">
                <div class="curator">Curated by JINUNG LEE</div>
                <h1>Research Hub</h1>
                <div class="meta">Research Map</div>
            </div>
            <div class="hero-actions">
            <nav class="site-tabs" aria-label="Site sections">
                <a href="../index.html">Archive</a>
                <a href="index.html" class="active" aria-current="page">Map</a>
                <a href="../ResearchNotes/index.html">Research Notes</a>
            </nav>
                <button class="theme-toggle" id="theme-toggle" type="button" aria-label="라이트/다크 모드 전환" title="라이트/다크 모드 전환">
                    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
                </button>
            </div>
        </div>
    </header>

    <main class="placeholder">
        <div class="card">
            <h2>Research Map 준비 중</h2>
            <p>문헌 간 계보·비교·주제 관계를 지도 형태로 정리할 예정입니다.</p>
        </div>
    </main>
    <script>
        // Light/dark toggle — keep in sync across index-rebuild template, Map/, ResearchNotes/
        (function () {
            var btn = document.getElementById('theme-toggle');
            if (!btn) return;
            btn.addEventListener('click', function () {
                var root = document.documentElement;
                var cur = root.getAttribute('data-theme') || 'light';
                var next = cur === 'dark' ? 'light' : 'dark';
                root.setAttribute('data-theme', next);
                try { localStorage.setItem('theme', next); } catch (e) {}
            });
        })();
    </script>
</body>
</html>
